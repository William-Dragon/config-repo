server:
  port: 8081

spring:
  application:
    name: jpa-service

  datasource:
    url: jdbc:mysql://localhost:3306/testdb?useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # use 'create' to reset tables every time (for dev only)
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
